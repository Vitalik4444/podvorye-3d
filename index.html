<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Холмогорское подворье — 3D-модель рынка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c87b3b'/%3E%3C/svg%3E">
<meta name="description" content="Интерактивная 3D-модель фермерского рынка «Холмогорское подворье»: осмотр фасадов и прогулка по торговому залу с зонами по альбому компоновки.">
<meta property="og:title" content="Холмогорское подворье — 3D-модель рынка">
<meta property="og:description" content="Осмотр здания снаружи и прогулка по торговому залу от первого лица.">
<meta property="og:type" content="website">
<style>
  :root{
    --ink:#1d1d1b; --brown:#c87b3b; --cream:#ece1d5; --paper:#f7f2ea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);
    font:14px/1.45 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block}

  header{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;
    gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;
    background:linear-gradient(180deg,rgba(29,29,27,.55),rgba(29,29,27,0));color:#fff;
    pointer-events:none}
  .mark{width:26px;height:26px;border-radius:50%;background:var(--brown);flex:none}
  .ttl{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;line-height:1.15}
  .ttl span{display:block;font-weight:600;letter-spacing:.14em;font-size:9px;opacity:.8}
  .rev{margin-left:auto;font-size:11px;letter-spacing:.06em;opacity:.85;text-align:right}

  #modes{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;display:none;gap:8px}
  #modes button{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:13px;
    padding:11px 20px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);
    box-shadow:0 6px 22px rgba(29,29,27,.28)}
  #modes button.on{background:var(--brown);color:#fff}

  #hint{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;display:none;
    font-size:12px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.65);white-space:nowrap}

  #pad{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));
    bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;
    display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px}
  #pad button{border:0;cursor:pointer;font-size:17px;border-radius:12px;
    background:rgba(255,255,255,.88);color:var(--ink);box-shadow:0 4px 14px rgba(29,29,27,.24)}
  #pad .up{grid-column:2}
  #pad .lf{grid-column:1;grid-row:2}
  #pad .dn{grid-column:2;grid-row:2}
  #pad .rt{grid-column:3;grid-row:2}

  #note{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:var(--paper);text-align:center;padding:24px}
  #note h1{margin:0;font-size:clamp(20px,4vw,30px);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  #note p{margin:0;max-width:420px;opacity:.7}
  #track{width:min(320px,70vw);height:4px;border-radius:2px;background:rgba(29,29,27,.14);overflow:hidden}
  #bar{height:100%;width:8%;background:var(--brown);transition:width .45s ease}

  /* метки зон */
  #spots{position:fixed;inset:0;z-index:4;pointer-events:none}
  .hs{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;
    cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:7px;
    font:inherit;white-space:nowrap;transition:opacity .18s}
  .hs .dot{width:15px;height:15px;border-radius:50%;flex:none;border:2.5px solid #fff;
    box-shadow:0 2px 9px rgba(29,29,27,.5);transition:transform .18s}
  .hs .lab{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 7px rgba(0,0,0,.85);
    opacity:0;transition:opacity .18s}
  .hs:hover .lab,.hs.near .lab{opacity:1}
  .hs:hover .dot{transform:scale(1.28)}

  /* карточка зоны */
  #card{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:9;
    background:var(--paper);box-shadow:-14px 0 44px rgba(29,29,27,.28);
    transform:translateX(102%);transition:transform .36s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;overflow:auto}
  #card.open{transform:none}
  #chero{padding:calc(24px + env(safe-area-inset-top,0px)) 26px 22px;color:#fff;position:relative}
  #cnum{position:absolute;right:20px;top:14px;font-size:76px;font-weight:800;opacity:.3;line-height:1}
  #ckind{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
  #cname{margin:5px 0 0;font-size:23px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1.14}
  #cbody{padding:20px 26px calc(26px + env(safe-area-inset-bottom,0px))}
  #cdim{font-weight:700;color:var(--brown);margin:0 0 12px;font-size:15px}
  #cnote{margin:0;line-height:1.6}
  #cchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
  #cchips span{background:rgba(29,29,27,.08);border-radius:999px;padding:6px 13px;font-size:11.5px}
  #cclose{position:absolute;right:16px;bottom:-18px;width:38px;height:38px;border-radius:50%;
    border:0;cursor:pointer;background:#fff;color:var(--ink);font-size:19px;line-height:1;
    box-shadow:0 5px 18px rgba(29,29,27,.3)}

  @media (max-width:560px){ .rev{display:none} #hint{font-size:11px;white-space:normal;
    width:80vw;text-align:center} .hs .lab{display:none} }
</style>
</head>

  <h1>Холмогорское подворье</h1>
  <p>Загружается 3D-модель рынка. Первый запуск занимает несколько секунд — модель распаковывается прямо в браузере.</p>

</div>

44.46],"maxp":[21.83,-38.3],"dims":[13660,6160]},{"num":11,"id":"Island_11","label":"Бакалея и паста-ателье","kind":"grocery","area":88.11,"top":2.61,"sheet":"Блок GR01","note":"Павильон на месте прежней бакалеи, работает один оператор. В центре пост паста-ателье: за стеклом готовят свежую пасту на компактном экструдере, рядом холодильник со свежей пастой. Стена сухой пасты на шесть видов с самостоятельным отвесом и печатью этикетки. Три дозатора специй на 12 каналов, порции 25, 50 и 100 г, один из них собирает смеси по рецепту. Два хлебных автомата и семь секций стеллажей общей длиной 16,3 м: крупы, мука, соусы, консервация, чай, приправы, наборы для ужина. Входы по 1 800 мм с двух торцов, проходы 1 500 мм, касса с продавцом и касса самообслуживания. Дозаторы специй нестандартные, поставщик пока не выбран.","badge":null,"c":[45.0,2.61,-17.525],"minp":[38.17,-20.75],"maxp":[51.83,-14.3],"dims":[13660,6450]},{"num":12,"id":"Island_12","label":"Сцена","kind":"stage","area":59.85,"top":3.0,"sheet":"Лист О-14","note":"Открытая платформа, отметка покрытия +0,450. Задняя стена удалена, перегородок и экрана нет. Три встроенные ступени в левом переднем углу. Зрительская площадка со стороны главного входа.","badge":null,"c":[30.0,3.0,-34.5],"minp":[26.85,-39.25],"maxp":[33.15,-29.75],"dims":[6300,9500]},{"num":13,"id":"Island_13","label":"Молочный и сырный ряд","kind":"dairy","area":84.15,"top":1.33,"sheet":"Лист О-03","note":"Холодильный остров того же контура, что и №10. Витрины Х1 Н 1 250, столы Р1 Н 900, проходы 1 390 мм. В модели витрины Х1 заменены холодильными витринами Skye, в них сыры.","badge":null,"c":[44.999,1.33,-41.38],"minp":[38.169,-44.46],"maxp":[51.829,-38.3],"dims":[13660,6160]},{"num":14,"id":"Island_14","label":"Бургерная, стейкхаус, мороженое и фрешбар","kind":"food","area":71.5,"top":2.9,"sheet":"Блок CF02","note":"Четыре секции по 6 500 × 2 750 мм, перегородки Н 2 400 сохранены, всё приготовление на виду у покупателя. Со стороны входа: 14.3 — мороженое (витрина джелато, холодная плита для ролл-мороженого, вафельница, ореховые пасты и топпинги из «Дома ореха»), 14.4 — фрешбар (соковыжималка, смузи-блендеры, выбор фруктов и ягод, смузи-велосипед). С обратной стороны: 14.1 — бургерная (smash-гриль, раклетница с сырной головкой, термоклеймо), 14.2 — стейкхаус (стеклянный шкаф созревания, выбор и взвешивание отруба, гриль на виду, дегустация трёх отрубов). Над грилями вытяжные зонты.","badge":null,"c":[15.0,2.9,-33.5],"minp":[8.5,-36.25],"maxp":[21.5,-30.75],"dims":[13000,5500]},{"num":15,"id":"Island_15","label":"Робот-бар и робот-кофейня","kind":"cafe","area":21.04,"top":2.708,"sheet":"Блок RC01","note":"Две станции спиной друг к другу. Робот-бар с лимонадами, морсами и холодным чаем обращён вглубь зала, робот-кофейня с кофе и какао — ко входу. Два робота, заказ и выдача через терминалы, сервисный проход 900 мм. Модели роботов условные, рабочие габариты уточняются по раскладке поставщика. Вокруг острова 14 столов, 56 мест.","badge":null,"c":[15.0,2.708,-23.0],"minp":[12.938,-25.55],"maxp":[17.062,-20.45],"dims":[4125,5100]},{"num":16,"id":"Island_16_17","label":"Грибной лес","kind":"mushroom","area":13.0,"top":2.68,"sheet":"Блок MF01","note":"Стеклянный павильон на месте островов №16 и №17. Три климатические камеры по три полки: вешенка, шиитаке и ежовик гребенчатый на трёх стадиях — субстрат, начало плодоношения, урожай. Прилавок со свежим урожаем и наборы для выращивания дома. Готовые блоки субстрата привозит специализированная ферма, климат и полив подбирает поставщик.","badge":null,"c":[27.75,2.68,-18.0],"minp":[26.75,-21.25],"maxp":[28.75,-14.75],"dims":[2000,6500]},{"num":18,"id":"Island_18_19","label":"Пасека за стеклом","kind":"bees","area":13.0,"top":2.68,"sheet":"Блок BE01","note":"Стеклянный павильон на месте островов №18 и №19. Цветочный сад, наблюдательный улей с сотами, откачка и фасовка мёда. Живая пчелосемья возможна только с коротким выходом пчёл на улицу — он пока не подтверждён. Запасной вариант: уличная пасека с видеотрансляцией или учебный улей под присмотром пчеловода.","badge":null,"c":[32.25,2.68,-18.0],"minp":[31.25,-21.25],"maxp":[33.25,-14.75],"dims":[2000,6500]},{"num":20,"id":"Island_20","label":"Овощи, фрукты и вертикальные фермы","kind":"produce","area":190.89,"top":2.4,"sheet":"Блок FV10","note":"Блок на месте островов №20 и №21. В центре два стеклянных павильона А и Б: двусторонние ряды развалов, по два холодильника, кассы у четырёх выходов, входы по 1 600 мм. По бокам четыре магазина с прилавками вдоль стен и две вертикальные фермы: томаты с огурцами и микрозелень. Хранение в основаниях прилавков.","badge":null,"c":[43.9,2.4,-29.95],"minp":[36.325,-36.25],"maxp":[51.475,-23.65],"dims":[15150,12600]},{"num":22,"id":"Island_22","label":"Детская комната","kind":"kids","area":50.85,"top":2.4,"sheet":"Лист ДК-01","note":"Прозрачное стекло от пола Н 2 400, раздвижной вход 1 800 мм. Касса у входа, стеллажи игрушек СИ1–СИ3, мягкие модули, открытая игровая арка, скамья для чтения с хранением. Комната просматривается насквозь.","badge":null,"c":[18.0,2.4,-9.55],"minp":[12.35,-11.8],"maxp":[23.65,-7.3],"dims":[11300,4500]},{"num":23,"id":"Island_23","label":"Кофейня","kind":"cafe","area":17.85,"top":1.95,"sheet":"Лист О-12","note":"Открытая точка у входа: наружные стенки и остекление сняты. Прилавок, кофемашина, мойка, холодильник и стеллаж сохранены на местах.","badge":null,"c":[33.9,1.95,-9.175],"minp":[32.2,-11.8],"maxp":[35.6,-6.55],"dims":[3400,5250]},{"num":null,"id":"Dairy_Vending_Line","label":"Молочный вендинг и роботы-мороженщики","kind":"vending","area":17.76,"top":2.63,"sheet":"Блок DV01","note":"Линия за молочным рядом, лицом к нему, проход перед автоматами 2 200 мм. Двенадцать модулей: два молокомата, два дозатора йогурта, четыре автомата с молоком, кефиром, сыром и йогуртом в упаковке, два автомата с яйцами и два робота-мороженщика.","badge":"МВ","c":[45.0,2.63,-47.229],"minp":[38.17,-47.879],"maxp":[51.83,-46.579],"dims":[13660,1300]},{"num":null,"id":"Hot_Food_Island","label":"Горячая еда и готовые обеды","kind":"food","area":32.78,"top":2.63,"sheet":"Блок HF01","note":"Линия из девяти автоматов за колбасным рядом, лицом к нему, проход перед автоматами 2 200 мм. Сэндвичи, робот хот-догов, пиццемат, готовая еда, готовые обеды, два автомата с наборами, напитки в бутылках и розлив на четыре крана. Кухни на месте нет, готовые блюда привозят. Робот хот-догов и модуль розлива пока условные, поставщики не выбраны.","badge":"ГЕ","c":[15.0,2.63,-47.779],"minp":[8.17,-48.979],"maxp":[21.83,-46.579],"dims":[13660,2400]},{"num":null,"id":"Left_Restaurant","label":"Ресторан с открытой кухней","kind":"food","area":69.89,"top":3.0,"sheet":"Блок RS02","note":"Ресторан в левом углу у входа, за новой аркой. Кухня отделена стеклом в бронзовых рамах: мойка и раковина для рук, холодный цех, индукционная плита, жарочная поверхность, пароконвектомат, вытяжка, охлаждаемый стол раздачи. Бар с кофемашиной вдоль глухой стены. В зале угловой диван со столом у окна, круглый стол на четыре места и два места у бара.","badge":"РЕ","c":[6.325,3.0,-9.35],"minp":[0.3,-12.25],"maxp":[12.35,-6.45],"dims":[12050,5800]},{"num":null,"id":"Left_Workshops_R1","label":"Мастерская вкуса","kind":"workshop","area":31.86,"top":3.0,"sheet":"Блок WK01","note":"Класс для кулинарных занятий. Стол ведущего, два передвижных стола на восемь мест, экран и камера над рабочим столом, ящики с ароматами, магнитная доска рецептов.","badge":"М1","c":[3.0,3.0,-15.3],"minp":[0.3,-18.25],"maxp":[5.7,-12.35],"dims":[5400,5900]},{"num":null,"id":"Left_Workshops_R2","label":"Живая мастерская","kind":"workshop","area":37.26,"top":3.0,"sheet":"Блок WK01","note":"Класс для занятий о растениях и продуктах. Стол ведущего, три передвижных стола на 12 мест, экран, цифровой микроскоп, интерактивный световой стол, шкаф с живыми семенами и колесо сезонов.","badge":"М2","c":[3.0,3.0,-21.8],"minp":[0.3,-25.25],"maxp":[5.7,-18.35],"dims":[5400,6900]},{"num":null,"id":"Left_Cafes_C1","label":"Китайское кафе «Чай и пар»","kind":"food","area":37.26,"top":3.0,"sheet":"Блок CF01","note":"Кафе с кухней за стеклом: холодильник, заготовочный стол, мойка, печь, горячая станция и вытяжка. Прилавок с кассой, дегустационная стойка на два места, четыре стола на восемь мест. В оформлении бамбуковый рельеф, горный пейзаж и фонари.","badge":"К1","c":[3.0,3.0,-32.8],"minp":[0.3,-36.25],"maxp":[5.7,-29.35],"dims":[5400,6900]},{"num":null,"id":"Left_Cafes_C2","label":"Балтийское кафе «Берег»","kind":"food","area":31.86,"top":3.0,"sheet":"Блок CF01","note":"Кафе с кухней за стеклом, оборудование как у китайского кафе. Прилавок с кассой и охлаждаемой витриной, дегустационная стойка на два места, льняной диван и столы. В оформлении балтийская волна, канатный декор и янтарные подвесные светильники.","badge":"К2","c":[3.0,3.0,-39.3],"minp":[0.3,-42.25],"maxp":[5.7,-36.35],"dims":[5400,5900]},{"num":null,"id":"Left_Sausage_Workshop","label":"Колбасный цех","kind":"production","area":37.26,"top":3.0,"sheet":"Блок SC01","note":"Производство за стеклом, работа видна из зала. Сырая и чистая зоны разделены перегородкой, персонал входит через санитарный тамбур с раковиной. В сырой зоне холодильник сырья, разделочный стол, мясорубка, фаршемешалка, весы, шприц, формовочный стол и мойка инвентаря. Проходная термокамера ведёт в чистую зону: шоковый охладитель, упаковочный стол, вакуумный упаковщик, принтер этикеток, холодильник готовой продукции. Термокамера пока в резерве: оборудование и технология не выбраны.","badge":"КЦ","c":[3.0,3.0,-45.8],"minp":[0.3,-49.25],"maxp":[5.7,-42.35],"dims":[5400,6900]},{"num":24,"id":"Island_24","label":"Дом ореха","kind":"shop","area":49.78,"top":2.86,"sheet":"Блок NT02","note":"Отдельное помещение с прозрачным стеклом от пола Н 2 400 и раздвижным входом 1 800 мм. Слева, на 4,3 м ширины, мастерская за стеклом: обжарочный аппарат, котёл для глазировки, упаковочный стол, мойка и пушка воздушного риса и кукурузы, над оборудованием резерв под вытяжку. В магазине стойка «Ореховая паста при вас» с двумя мельницами, дегустационная витрина, стеллажи с орехами вдоль дальней стены и в нише у колонны. Маслопресс, мёд и проекция в этот вариант не вошли.","badge":null,"c":[42.034,2.86,-9.55],"minp":[36.4,-11.8],"maxp":[47.669,-7.3],"dims":[11269,4500]},{"num":null,"id":"Island_MEAT","label":"Мясной павильон","kind":"meatpav","area":216.6,"top":3.0,"sheet":"Вне альбома, по модели","note":"Расстановка ME03. Охлаждаемые витрины собраны в семь линий: Г-образная группа со стороны зала, П-образный остров у правой стены и угловая группа у дальней стены. Вдоль левой стены рабочая линия продавцов: столы, тепловой модуль, шкафы, мясорубка, мойка, морозильный ларь и холодильник со стеклянной дверью. У стены со стороны зала и у дальней стены мойки, столы, шкафы, ларь и глухой холодильник. В дальнем правом углу разделочная за стеклом: ленточная пила с роликовыми столами и разделочный стол. По периметру под потолком световые экраны.с рабочими столами и три подвешенные полутуши. Центральная группа витрин стоит на общей оси двух входов (схема R35, лист 3). По периметру под потолком световые экраны.","badge":"М","c":[18.05,3.0,-63.15],"minp":[12.0,-72.1],"maxp":[24.1,-54.2],"dims":[12100,17900]},{"num":null,"id":"Island_FISH","label":"Рыбный павильон","kind":"fishpav","area":216.6,"top":1.33,"sheet":"Вне альбома, по модели","note":"Холодильные витрины Skye: рыба и морепродукты на льду. По периметру под потолком световые экраны.","badge":"Р","c":[41.95,1.33,-63.15],"minp":[35.9,-72.1],"maxp":[48.0,-54.2],"dims":[12100,17900]},{"num":null,"id":"Остров_entrance","label":"Входная группа","kind":"entry","sheet":"Лист ВГ-01","area":null,"dims":null,"badge":"ВГ","note":"Слева от входа два банкомата 900 × 620 × 1 650 и автомат с растворимым кофе 800 × 620 × 1 850. Справа постамат с терминалом 3 000 × 600 × 2 100 у дальней стены, лицом ко входу, свободный проход перед ним 2 500 мм. Дальше слева аптека, справа пивной магазин.","c":[29.
