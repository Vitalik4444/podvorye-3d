<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оформление заказа — Холмогорское подворье</title>
<meta name="description" content="Оформление заказа: контакты, доставка или самовывоз, слот выдачи и оплата.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E&#127806;%3C/text%3E%3C/svg%3E">
</head>
<body data-page="checkout">
<main class="page">

  <section class="paper grain">
    <div class="wrap">
      <div class="ed-index-head">
        <div>
          <div class="crumbs"><a href="/index.html">Главная</a><span>›</span><a href="/cart.html">Корзина</a><span>›</span><span>Оформление</span></div>
          <h1>Оформление заказа</h1>
        </div>
        <div class="side">Оплата — при получении<br><b>или картой онлайн</b></div>
      </div>
    </div>
  </section>
  <section class="sect" style="padding-top:26px">
    <div class="wrap">
      <div class="cart" id="coWrap">
        <form class="form" data-form="Заказ">
          <h3 class="sect-t" style="font-size:20px;margin-bottom:18px">Контакты</h3>
          <div class="frow">
            <div class="field"><label>Имя</label><input required placeholder="Как к вам обращаться"></div>
            <div class="field"><label>Телефон</label><input required type="tel" placeholder="+7"></div>
          </div>
          <h3 class="sect-t" style="font-size:20px;margin:30px 0 18px">Как получить</h3>
          <div class="field"><label>Способ</label>
            <select style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff">
              <option>Самовывоз — готово через 40 минут</option>
              <option>Доставка 10:00 — 13:00</option>
              <option>Доставка 13:00 — 17:00</option>
              <option>Доставка 17:00 — 20:00</option>
            </select></div>
          <div class="field"><label>Адрес (для доставки)</label><input placeholder="Улица, дом, квартира"></div>
          <div class="field"><label>Комментарий</label><textarea rows="3" placeholder="Оставить у двери, позвонить заранее…"></textarea></div>
          <button class="btn btn-primary" type="submit" style="margin-top:8px">Подтвердить заказ</button>
          <p class="note">Прототип: заказ не отправляется. Перед оплатой сверим наличие и напишем в мессенджер.</p>
        </form>
        <aside class="summary" id="coSummary"></aside>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/src/site.js"></script>
</body></html>
